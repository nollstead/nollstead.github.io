title: Nollstead Studio
description: Portfolio and project showcase by Craig Sweet.

# Using the gem-based theme (correct for GitHub Actions)
theme: just-the-docs

permalink: pretty

# Force Jekyll to publish JSON files anywhere in the repo
include:
  - "*.json"
  - "**/*.json"

# Projects collection (each file in _projects/ becomes a page)
collections:
  projects:
    output: true

# Make each project URL live at /project-slug/ (e.g., /project2/)
defaults:
  - scope:
      path: ""
      type: projects
    values:
      permalink: "/:title/"

just_the_docs:
  search_enabled: true
  custom_css:
    - /assets/css/layout.css
    - /assets/css/cards.css

