title: Nollstead Studio
description: Portfolio and project showcase by Craig Sweet.

# When using GitHub Actions, DO NOT use remote_theme.
# Use the gem-based theme instead:
theme: just-the-docs

permalink: pretty

# Custom color scheme (we will create this file next)
color_scheme: nollstead

# Force Jekyll to publish JSON files anywhere in the repo
include:
  - "*.json"
  - "**/*.json"

# Projects collection (each file in _projects/ becomes a page)
collections:
  projects:
    output: true

# Make each project URL live at /project-slug/ (e.g., /project2/)
defaults:
  - scope:
      path: ""
      type: projects
    values:
      permalink: "/:title/"

just_the_docs:
  search_enabled: true
