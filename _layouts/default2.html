---
# Left-nav layout for homepage only.
# Inherits Cayman <head> and default body structure via layout: default.
layout: default
---

<!-- Page-local CSS: ONLY the left sidebar styles remain inline -->
<style>
  /* Fixed, full-height left sidebar flush to the page edge */
  .nx-sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 272px;             /* tweak to 260/280/300 as you prefer */
    height: 100vh;            /* full viewport height */
    box-sizing: border-box;
    padding: 18px 14px;
    background: #f8fafc;
    border-right: 1px solid #e6e8f0;
    border-radius: 0 !important;   /* slab edge */
    box-shadow: 2px 0 18px rgba(0,0,0,.05);
    display: flex; flex-direction: column;
    z-index: 10;
  }

  /* Brand (avatar + title) inside the left nav */
  .nx-brand { text-align: center; margin-bottom: 10px; }
  .nx-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    object-fit: cover; display: inline-block;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .nx-title { font-size: 1rem; margin: 8px 0 0; color: #0f172a; font-weight: 600; }

  /* Left-nav links */
  .nx-nav { margin-top: 8px; }
  .nx-nav ul { list-style: none; margin: 0; padding: 0; }
  .nx-nav li { margin: 4px 0; }
  .nx-nav a {
    display: block;
    padding: 9px 10px;
    border-radius: 9px;
    color: #0366d6; /* Cayman blue */
    text-decoration: none;
  }
  .nx-nav a:hover { background: #e6f0fb; }
  .nx-nav .is-active > a { background: #ddebff; font-weight: 600; }
</style>

<!-- BODY: Only inject the left sidebar; let Cayman control everything else -->
<aside class="nx-sidebar" aria-label="Left navigation">
  <div class="nx-brand">
    {{ 
    <div class="nx-title">Nollstead Studio</div>
  </div>

  <nav class="nx-nav">
    <ul>
      <li class="{% if page.url == '/' %}is-active{% endif %}">
        {{ Home</a>
      </li>
      <li class="{% if page.url == '/projects/' %}is-active{% endif %}">
        {{ Projects</a>
      </li>
      <li class="{% if page.url == '/categories/' %}is-active{% endif %}">
        {{ Categories</a>
      </li>
      <li class="{% if page.url == '/about/' %}is-active{% endif %}">
        {{ About</a>
      </li>
    </ul>
  </nav>
</aside>

<!-- Let Cayman render the page exactly as it normally would -->
{{ content }}
