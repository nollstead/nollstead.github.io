---
# Left-nav layout for Cayman (homepage-only)
# Keeps Cayman <head> but replaces the body structure with a two-column shell.
layout: default
---

<!-- Page-local CSS: only affects pages using layout: default2 -->
<style>
  /* 1) Hide Cayman’s masthead (big top banner) on this layout */
  .page-header { display: none !important; }

  /* 2) Break out of Cayman's centered max-width for this page */
  .main-content.nx-main {
    max-width: none;
    width: 100%;
    padding-left: 0;
    padding-right: 0;
  }

  /* 3) Two-column shell: sidebar flush left, content to the right */
  .nx-shell {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr); /* fixed sidebar + flexible content */
    gap: 1.75rem;
    align-items: start;
    width: 100%;
    padding: 1rem 2rem 2.5rem 2rem;  /* gentle gutters on both sides */
    box-sizing: border-box;
    min-height: 100vh;               /* span viewport height */
  }

  /* 4) Sidebar (sticky, full-height feel) */
  .nx-sidebar {
    position: sticky;
    top: 1rem;
    align-self: start;
    height: calc(100vh - 2rem);
    padding: 1rem;
    background: #f8fafc;
    border: 1px solid #e6e8f0;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
  }

  /* Brand block */
  .nx-brand { text-align: center; margin-bottom: .75rem; }
  .nx-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover; display: inline-block;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .nx-title { font-size: 1.05rem; margin: .55rem 0 .15rem; color: #0f172a; }
  .nx-subtle { color: #6b7280; font-size: .9rem; margin: 0; }

  /* Vertical nav */
  .nx-nav { margin-top: .5rem; }
  .nx-nav ul { list-style: none; margin: 0; padding: 0; }
  .nx-nav li { margin: .25rem 0; }
  .nx-nav a {
    display: block;
    padding: .48rem .6rem;
    border-radius: 9px;
    color: #0366d6;                 /* Cayman blue */
    text-decoration: none;
  }
  .nx-nav a:hover { background: #e6f0fb; }
  .nx-nav .is-active > a {
    background: #ddebff;
    font-weight: 600;
  }

  /* 5) Right-side content column tweaks */
  .nx-content { min-width: 0; }

  /* Hide any “Home / About” top links inside content for this layout */
  .nx-shell .top-links { display: none !important; }

  /* 6) Force a maximum of 3 cards per row (your index.md already builds the cards) */
  .nx-shell .card-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    margin: 1.25rem 0 2.5rem; /* preserve your existing spacing */
  }
  @media (max-width: 1200px) {
    .nx-shell .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .nx-shell .card-grid { grid-template-columns: 1fr; }
  }

  /* Responsive: stack on mobile */
  @media (max-width: 900px) {
    .nx-shell { grid-template-columns: 1fr; }
    .nx-sidebar { position: static; height: auto; margin-bottom: 1rem; }
  }
</style>

<!-- Body: replace the central Cayman wrapper with our two-column shell -->
<main id="content" class="main-content nx-main" role="main">
  <div class="nx-shell">

    <!-- LEFT NAV -->
    <aside class="nx-sidebar" aria-label="Left navigation">
      <div class="nx-brand">
        <img src="{{ '/assets/Robot2.jpg' | relative_url }}" class="nx-avatar" alt="Avatar">
        <h1 class="nx-title">Nollstead Studio</h1>
        <!-- Optional subtitle; delete if not wanted -->
        <!-- <p class="nx-subtle">Portfolio &amp; projects</p> -->
      </div>

      <nav class="nx-nav">
        <ul>
          <li class="{% if page.url == '/' %}is-active{% endif %}">
            <a href="{{ '/' | relative_url }}">Home</a>
          </li>
          <li class="{% if page.url == '/projects/' %}is-active{% endif %}">
            <a href="{{ '/projects/' | relative_url }}">Projects</a>
          </li>
          <li class="{% if page.url == '/categories/' %}is-active{% endif %}">
            <a href="{{ '/categories/' | relative_url }}">Categories</a>
          </li>
          <li class="{% if page.url == '/about/' %}is-active{% endif %}">
            <a href="{{ '/about/' | relative_url }}">About</a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- RIGHT CONTENT -->
    <section class="nx-content">
      {{ content }}
    </section>
  </div>
</main>
