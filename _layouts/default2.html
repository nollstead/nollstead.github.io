---
# Left-nav layout for Cayman (homepage-only).
# Inherits Cayman <head> (layout: default), then replaces the body structure.
layout: default
---

<!-- Page-local CSS: ONLY affects pages using layout: default2 -->
<style>
  /* Hide Cayman’s masthead on this page */
  .page-header { display: none !important; }

  /* ===== FIXED LEFT SIDEBAR + CONTENT FRAME ===== */
  /* A fixed, full-height sidebar that hugs the left edge of the viewport */
  .nx-sidebar {
    position: fixed;
    inset: 0 auto 0 0;           /* top:0; right:auto; bottom:0; left:0 */
    width: 268px;                /* sidebar width */
    box-sizing: border-box;
    padding: 16px 14px;
    background: #f8fafc;
    border-right: 1px solid #e6e8f0;
    box-shadow: 2px 0 18px rgba(0,0,0,.06);
    display: flex; flex-direction: column;
    z-index: 10;
  }

  /* Right content column: push it to the right by the sidebar width + gutter */
  .nx-content-frame {
    /* leave room for the fixed sidebar + a gutter */
    padding-left: calc(268px + 28px);
    padding-right: 28px;
    padding-top: 18px;
    padding-bottom: 48px;
    box-sizing: border-box;
    width: 100%;
  }

  /* Make the working column nicely wide on desktops (but not overly) */
  .nx-content-inner {
    max-width: 1400px;   /* adjust if you want even wider */
    margin: 0 auto;      /* prevent hard-left hugging on ultrawide screens */
    min-width: 0;
  }

  /* ===== Sidebar branding (avatar + title) ===== */
  .nx-brand { text-align: center; margin-bottom: 10px; }
  .nx-avatar {
    width: 66px; height: 66px; border-radius: 50%;
    object-fit: cover; display: inline-block;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .nx-title {
    font-size: 1rem; margin: 8px 0 2px; color: #0f172a; font-weight: 600;
  }

  /* ===== Left nav list ===== */
  .nx-nav { margin-top: 8px; }
  .nx-nav ul { list-style: none; margin: 0; padding: 0; }
  .nx-nav li { margin: 4px 0; }
  .nx-nav a {
    display: block;
    padding: 9px 10px;
    border-radius: 9px;
    color: #0366d6;               /* Cayman blue */
    text-decoration: none;
  }
  .nx-nav a:hover { background: #e6f0fb; }
  .nx-nav .is-active > a {
    background: #ddebff;
    font-weight: 600;
  }

  /* ===== Projects grid: force up to 3 columns (use your existing markup) ===== */
  .nx-content-inner .card-grid {
    display: grid;                 /* ensure grid even if previous CSS changed it */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    margin: 1.25rem 0 2.5rem;
  }
  @media (max-width: 1220px) {
    .nx-content-inner .card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 720px) {
    .nx-content-inner .card-grid { grid-template-columns: 1fr; }
  }

  /* Optional: tighten any “Projects” H2 spacing on this page */
  .nx-content-inner h2:first-of-type { margin-top: .25rem; }

  /* On small screens, collapse the layout into a vertical flow */
  @media (max-width: 900px) {
    .nx-sidebar {
      position: static;
      width: auto;
      inset: auto;
      border-right: none;
      border-bottom: 1px solid #e6e8f0;
      box-shadow: 0 6px 12px rgba(0,0,0,.06);
      border-radius: 0;
    }
    .nx-content-frame { padding: 16px; }
  }
</style>

<!-- BODY: fixed left nav + content frame to the right -->
<div class="nx-sidebar" aria-label="Left navigation">
  <div class="nx-brand">
    <img class="nx-avatar" src="{{ '/assets/Robot2.jpg' | relative_url }}" alt="Avatar" />
    <div class="nx-title">Nollstead Studio</div>
  </div>

  <nav class="nx-nav">
    <ul>
      <li class="{% if page.url == '/' %}is-active{% endif %}">
        <a href="{{ '/' | relative_url }}">Home</a>
      </li>
      <li class="{% if page.url == '/projects/' %}is-active{% endif %}">
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
      </li>
      <li class="{% if page.url == '/categories/' %}is-active{% endif %}">
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
      </li>
      <li class="{% if page.url == '/about/' %}is-active{% endif %}">
        <a href="{{ '/about/' | relative_url }}">About</a>
      </li>
    </ul>
  </nav>
</div>

<!-- Right column -->
<main id="content" class="nx-content-frame" role="main">
  <div class="nx-content-inner">
    {{ content }}
  </div>
</main>
