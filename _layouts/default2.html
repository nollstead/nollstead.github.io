---
# Left-nav layout for Cayman (homepage only).
# Inherits Cayman <head> via `layout: default`, then replaces body structure.
layout: default
---

<!-- Page-local CSS: ONLY affects pages using layout: default2 -->
<style>
  /* Hide Cayman’s big masthead for this layout */
  .page-header { display: none !important; }

  /* ===== FIXED FULL-HEIGHT SIDEBAR ===== */
  .nx-sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 280px;               /* <-- tweak to 260/300 to taste */
    box-sizing: border-box;
    padding: 18px 14px;
    background: #f8fafc;
    border-right: 1px solid #e6e8f0;
    /* Full-height slab: no rounded corners */
    border-radius: 0;
    box-shadow: 2px 0 18px rgba(0,0,0,.05);
    display: flex; flex-direction: column;
    z-index: 10;
  }

  /* Brand area (avatar + title) */
  .nx-brand { text-align: center; margin-bottom: 10px; }
  .nx-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    object-fit: cover; display: inline-block;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .nx-title {
    font-size: 1rem; margin: 8px 0 0; color: #0f172a; font-weight: 600;
  }

  /* Sidebar nav */
  .nx-nav { margin-top: 8px; }
  .nx-nav ul { list-style: none; margin: 0; padding: 0; }
  .nx-nav li { margin: 4px 0; }
  .nx-nav a {
    display: block;
    padding: 9px 10px;
    border-radius: 9px;
    color: #0366d6; /* Cayman blue */
    text-decoration: none;
  }
  .nx-nav a:hover { background: #e6f0fb; }
  .nx-nav .is-active > a { background: #ddebff; font-weight: 600; }

  /* ===== CONTENT COLUMN (roomy, not centered) ===== */
  .nx-content-frame {
    /* Reserve space for the fixed sidebar + a gutter */
    margin-left: calc(280px + 32px);
    margin-right: 32px;
    padding-top: 18px; padding-bottom: 48px;
    box-sizing: border-box;
  }

  /* Cap to 3 columns max by limiting the working width.
     3 × 340px columns + gaps ≈ ~1100–1160px total. */
  .nx-content-inner {
    max-width: 1160px;        /* <-- bump to 1200/1320 if you want a bit wider */
    margin: 0 auto;
    min-width: 0;
  }

  /* Force the projects grid to be up to 3 across, with responsive fallbacks.
     Your existing index.md builds the cards; we only control the columns here. */
  .nx-content-inner .card-grid {
    display: grid;  /* ensure grid even if global CSS changes */
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.1rem;
    margin: 1.25rem 0 2.5rem;
  }
  @media (max-width: 1200px) {
    .nx-content-inner .card-grid { grid-template-columns: repeat(2, minmax(320px, 1fr)); }
  }
  @media (max-width: 720px) {
    .nx-content-inner .card-grid { grid-template-columns: 1fr; }
  }

  /* Keep cards looking like your original: your own .card styles already do this.
     The "narrow/long" look was due to too-narrow columns; fixed by min 340px above. */

  /* Remove stray "Home / About" at top of right column on this layout (temporary) */
  .nx-content-inner > p:first-child a[href="/"],
  .nx-content-inner > p:first-child a[href="/about/"] { display: none !important; }

  /* Responsive: sidebar stacks on small screens */
  @media (max-width: 900px) {
    .nx-sidebar {
      position: static; width: auto; top: auto; bottom: auto;
      border-right: none; border-bottom: 1px solid #e6e8f0;
      box-shadow: 0 6px 12px rgba(0,0,0,.06);
    }
    .nx-content-frame { margin: 0; padding: 16px; }
    .nx-content-inner { max-width: none; }
  }
</style>

<!-- ===== BODY: fixed left nav + roomy content to the right ===== -->
<aside class="nx-sidebar" aria-label="Left navigation">
  <div class="nx-brand">
    <img class="nx-avatar" src="{{ '/assets/Robot2.jpg' | relative_url }}" alt="Avatar">
    <div class="nx-title">Nollstead Studio</div>
  </div>

  <nav class="nx-nav">
    <ul>
      <li class="{% if page.url == '/' %}is-active{% endif %}">
        <a href="{{ '/' | relative_url }}">Home</a>
      </li>
      <li class="{% if page.url == '/projects/' %}is-active{% endif %}">
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
      </li>
      <li class="{% if page.url == '/categories/' %}is-active{% endif %}">
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
      </li>
      <li class="{% if page.url == '/about/' %}is-active{% endif %}">
        <a href="{{ '/about/' | relative_url }}">About</a>
      </li>
    </ul>
  </nav>
</aside>

<main id="content" class="nx-content-frame" role="main">
  <div class="nx-content-inner">
    {{ content }}
  </div>
</main>
``
