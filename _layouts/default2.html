---
# Left-nav layout (homepage only). Inherits Cayman <head> via layout: default.
layout: default
---

<!-- Page-local CSS: ONLY affects pages using layout: default2 -->
<style>
  /* Hide Cayman’s big masthead on this page */
  .page-header { display: none !important; }

  /* ===== FIXED, FULL-HEIGHT LEFT SIDEBAR (flush to page edge) ===== */
  .nx-sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 280px;                 /* tweak to 260/300 if you prefer */
    box-sizing: border-box;
    padding: 18px 14px;
    background: #f8fafc;
    border-right: 1px solid #e6e8f0;
    border-radius: 0;             /* slab (no rounded bottom) */
    box-shadow: 2px 0 18px rgba(0,0,0,.05);
    display: flex; flex-direction: column;
    z-index: 10;
  }

  /* Brand (avatar + title) */
  .nx-brand { text-align: center; margin-bottom: 10px; }
  .nx-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    object-fit: cover; display: inline-block;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .nx-title { font-size: 1rem; margin: 8px 0 0; color: #0f172a; font-weight: 600; }

  /* Sidebar nav */
  .nx-nav { margin-top: 8px; }
  .nx-nav ul { list-style: none; margin: 0; padding: 0; }
  .nx-nav li { margin: 4px 0; }
  .nx-nav a {
    display: block;
    padding: 9px 10px;
    border-radius: 9px;
    color: #0366d6;               /* Cayman blue */
    text-decoration: none;
  }
  .nx-nav a:hover { background: #e6f0fb; }
  .nx-nav .is-active > a { background: #ddebff; font-weight: 600; }

  /* ===== ROOMY RIGHT COLUMN (not centered/squeezed) ===== */
  .nx-content-frame {
    /* reserve space for the fixed sidebar + a small gutter */
    margin-left: calc(280px + 32px);
    margin-right: 32px;
    padding-top: 18px; padding-bottom: 48px;
    box-sizing: border-box;
  }

  /* Working width tuned for a 3‑column projects grid */
  .nx-content-inner {
    max-width: 1160px;            /* 3 columns + gaps; raise to 1200/1280 if you like */
    margin: 0 auto;               /* center within the available area (not the page) */
    min-width: 0;
  }

  /* ===== Project grid: force up to 3 across (your cards remain unchanged) ===== */
  .nx-content-inner .card-grid {
    display: grid;  /* ensure grid regardless of prior CSS */
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 1.1rem;
    margin: 1.25rem 0 2.5rem;
  }
  @media (max-width: 1200px) {
    .nx-content-inner .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  }
  @media (max-width: 720px) {
    .nx-content-inner .card-grid { grid-template-columns: 1fr !important; }
  }

  /* Keep your card look; the “tall/narrow” issue was column width—now fixed. */

  /* ===== TEMP: hide the redundant "Home / About" links in content on this layout ===== */
  .nx-content-inner .top-links { display: none !important; }

  /* Mobile: sidebar becomes a header block on top */
  @media (max-width: 900px) {
    .nx-sidebar {
      position: static; width: auto; top: auto; bottom: auto;
      border-right: none; border-bottom: 1px solid #e6e8f0;
      box-shadow: 0 6px 12px rgba(0,0,0,.06);
    }
    .nx-content-frame { margin: 0; padding: 16px; }
    .nx-content-inner { max-width: none; }
  }
</style>

<!-- ===== BODY: fixed left nav + roomy content to the right ===== -->
<aside class="nx-sidebar" aria-label="Left navigation">
  <div class="nx-brand">
    <img class="nx-avatar" src="{{ '/assets/Robot2.jpg' | relative_url }}" alt="Avatar">
    <div class="nx-title">Nollstead Studio</div>
  </div>

  <nav class="nx-nav">
    <ul>
      <li class="{% if page.url == '/' %}is-active{% endif %}">
        <a href="{{ '/' | relative_url }}">Home</a>
      </li>
      <li class="{% if page.url == '/projects/' %}is-active{% endif %}">
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
      </li>
      <li class="{% if page.url == '/categories/' %}is-active{% endif %}">
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
      </li>
      <li class="{% if page.url == '/about/' %}is-active{% endif %}">
        <a href="{{ '/about/' | relative_url }}">About</a>
      </li>
    </ul>
  </nav>
</aside>

<main id="content" class="nx-content-frame" role="main">
  <div class="nx-content-inner">
    {{ content }}
  </div>
</main>
